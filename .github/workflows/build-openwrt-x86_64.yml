name: Build OpenWrt x86_64

on:
  push:
    branches:
      - 2514-dns-ecs-client-id
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-openwrt-x86-64:
    name: Build Linux amd64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build AdGuard Home with stable UI
        run: |
          make \
            CLIENT_DIR="client" \
            ARCH="amd64" \
            OS="linux" \
            GOAMD64="v1" \
            SIGN="0" \
            CHANNEL="development" \
            VERSION="v0.0.0-ecs-client-id" \
            VERBOSE="1" \
            build-release

      - name: Inspect build
        run: |
          file dist/AdGuardHome_linux_amd64/AdGuardHome/AdGuardHome
          dist/AdGuardHome_linux_amd64/AdGuardHome/AdGuardHome --version
          sha256sum dist/AdGuardHome_linux_amd64.tar.gz

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AdGuardHome-openwrt-x86_64-stable-ui
          path: |
            dist/AdGuardHome_linux_amd64.tar.gz
            dist/checksums.txt
            dist/version.txt
          if-no-files-found: error
          retention-days: 30